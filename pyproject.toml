[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pays"
version = "0.1.0"
description = "Asynchronous payment processing with a transactional outbox"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy[asyncio,postgresql-asyncpg]>=2.1.2,<2.2",
    "faststream[rabbit]>=0.7.7,<0.8",
    "alembic>=1.14,<2",
    "httpx>=0.28,<1",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.12,<1",
    "mypy>=2.4,<3",
    "pyright[nodejs]>=1.1.414,<2",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires a dedicated PostgreSQL test database and RabbitMQ"]

[tool.ruff]
line-length = 80
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
files = ["src", "tests", "migrations", "examples"]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_typed = true
init_forbid_extra = true

[tool.pyright]
include = ["src", "tests", "migrations", "examples"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportDeprecated = "error"
reportUnnecessaryTypeIgnoreComment = "error"
